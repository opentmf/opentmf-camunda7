name: Multi-platform Docker Build and Push for Tags

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: eclipse-temurin:17-jre-jammy

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # Log in to GitHub Container Registry
    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    # Build and push the Docker image for multiple platforms
    - name: Build and push Docker image
      env:
        DOCKER_REGISTRY: ghcr.io
        IMAGE_NAME: pia-commons/${{ github.repository }}  # Use the full path for the organization
        BUILD_NUMBER: ${{ github.ref_name }}  # Tag name
      run: |
        docker buildx create --name multi-arch --use
        docker buildx build \
          --platform linux/amd64,linux/arm64/v8 \
          -t ${DOCKER_REGISTRY}/${IMAGE_NAME}:${BUILD_NUMBER} \
          --push \
          .
        docker buildx rm multi-arch
